# Builds the CompanyVal AI frontend and deploys it to GitHub Pages.
#
# By default the site is built in STATIC DEMO mode: it bundles a snapshot of the
# seeded engine data (frontend/src/demo/data.json) plus a display-only mirror of
# the valuation math, so the Pages site renders fully — including a live
# Simulation Lab — without a backend.
#
# To point the Pages site at a hosted FastAPI backend instead (Render/Railway/
# Fly.io), set a repository variable VITE_API_URL (Settings → Secrets and
# variables → Actions → Variables) and re-run the workflow.
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (static demo unless VITE_API_URL is set)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_STATIC_DEMO: ${{ vars.VITE_API_URL == '' && 'true' || 'false' }}

      - name: SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
